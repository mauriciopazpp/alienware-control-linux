<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Alienware Control: temperatures, RGB lighting and power settings for Alienware laptops on Linux">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090D"/>
      <stop offset="1" stop-color="#0E1420"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#3EE8FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3EE8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#8A5CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8A5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EE8FF"/>
      <stop offset="1" stop-color="#8A5CFF"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFF6FF"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glowC)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glowV)"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <!-- dial gauge -->
  <g transform="translate(250 180)">
    <circle r="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="16"
            stroke-dasharray="527.8 703.7" stroke-linecap="round" transform="rotate(135)"/>
    <circle r="112" fill="none" stroke="url(#accent)" stroke-width="16"
            stroke-dasharray="340 703.7" stroke-linecap="round" transform="rotate(135)"/>
    <circle r="112" fill="none" stroke="#3EE8FF" stroke-opacity="0.18" stroke-width="30"
            stroke-dasharray="340 703.7" stroke-linecap="round" transform="rotate(135)"/>
    <!-- fan -->
    <g fill="url(#accent)">
      <path d="M0-10 C7-46 40-54 47-36 C52-22 29-11 9-4 Z"/>
      <path d="M0-10 C7-46 40-54 47-36 C52-22 29-11 9-4 Z" transform="rotate(120)"/>
      <path d="M0-10 C7-46 40-54 47-36 C52-22 29-11 9-4 Z" transform="rotate(240)"/>
    </g>
    <circle r="12" fill="#0B0E14" stroke="url(#accent)" stroke-width="4"/>
  </g>

  <!-- text -->
  <text x="450" y="160" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-1">Alienware Control</text>
  <text x="454" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#A7B0BE">Temperatures, RGB lighting and BIOS power settings</text>
  <text x="454" y="252" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#A7B0BE">for Alienware laptops on Linux</text>

  <!-- key row -->
  <g transform="translate(454 280)">
    <rect x="0"   y="0" width="46" height="26" rx="6" fill="none" stroke="#3EE8FF" stroke-opacity="0.9" stroke-width="2"/>
    <rect x="56"  y="0" width="46" height="26" rx="6" fill="none" stroke="#3EE8FF" stroke-opacity="0.75" stroke-width="2"/>
    <rect x="112" y="0" width="46" height="26" rx="6" fill="none" stroke="#5FB8FF" stroke-opacity="0.75" stroke-width="2"/>
    <rect x="168" y="0" width="46" height="26" rx="6" fill="none" stroke="#7A8CFF" stroke-opacity="0.75" stroke-width="2"/>
    <rect x="224" y="0" width="46" height="26" rx="6" fill="none" stroke="#8A5CFF" stroke-opacity="0.85" stroke-width="2"/>
    <rect x="280" y="0" width="150" height="26" rx="6" fill="none" stroke="#8A5CFF" stroke-opacity="0.95" stroke-width="2"/>
  </g>
</svg>
